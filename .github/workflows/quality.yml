name: Quality

on:
  push:
    branches: [main, feat/mvp-vertical-slice]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check tracked secret patterns
        run: |
          set -euo pipefail
          cron_secret_key="UPDATE_WEATHER_CRON_SECRET"
          tracked_secret_pattern="eyJ[A-Za-z0-9_-]{20,}|sb_""secret_[A-Za-z0-9_-]+|service_""role_[A-Za-z0-9_-]+|${cron_secret_key}=[^$<{[:space:]]+"
          if git grep -n -E "$tracked_secret_pattern" -- ':!pnpm-lock.yaml' ':!supabase/config.toml'; then
            echo "Potential secret pattern found in tracked files."
            exit 1
          fi

      - name: Verify PWA assets and policy
        run: node scripts/verify-pwa.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Mobile E2E (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local Supabase
        # Supabase prints local service keys during startup. Keep its output
        # out of the CI log; run-local.mjs reads status in memory instead.
        run: pnpm exec supabase start > /tmp/karidoki-supabase-start.log 2>&1

      - name: Lint public database schema
        run: pnpm exec supabase db lint --local --schema public --level warning --fail-on error

      - name: Run database integration and security tests
        run: |
          set -euo pipefail
          for test_file in supabase/tests/*.sql; do
            docker exec -i supabase_db_karidoki-navi psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f - < "$test_file"
          done

      - name: Run mobile E2E
        run: pnpm e2e:local

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup > /tmp/karidoki-supabase-stop.log 2>&1 || true
