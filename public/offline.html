<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#315c2b" />
    <title>オフライン | 刈りどきナビ</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; background: #f6f5eb; color: #1b2418; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #d3d9ce; border-radius: 20px; background: #fffefa; box-shadow: 0 14px 40px rgba(37, 63, 34, .08); text-align: center; }
      .mark { display: grid; width: 64px; height: 64px; margin: 0 auto 18px; place-items: center; border-radius: 50%; background: #dfead5; font-size: 2rem; }
      h1 { margin: 0 0 12px; font-size: 1.4rem; }
      p { margin: 0; color: #687064; line-height: 1.7; }
      strong { color: #315c2b; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🌾</div>
      <h1>通信できません</h1>
      <p>保存済みの画面は利用できます。<br /><strong>オンラインに戻ったら再読み込み</strong>してください。</p>
    </main>
  </body>
</html>
